plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.46,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // Forge 1.20.6 and newer use official mappings at runtime, so we shouldn't reobf from official to SRG
    reobf = false

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development, applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Optional additional logging. The markers can be added/remove as needed, separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
//            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            // Recommended for development - enables more descriptive errors at the cost of slower startup and registration.
            property 'eventbus.api.strictRuntimeChecks', 'true'

            arg "-mixin.config=${mod_id}.mixins.json"
        }

        client {
            if (project.hasProperty('xdolfSmokeTest')) property 'xdolf.smokeTest', 'true'
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Forge 1.21.6+ uses EventBus 7, which shifts most of its runtime validation to compile-time via an annotation processor
    // to improve performance in production environments. This line is required to enable said compile-time validation
    // in your development environment, helping you catch issues early.
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.12'

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar) {
    from('LICENSE')
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1', // We are version 1 of ourselves
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors
        ])
        attributes['MixinConfigs'] = "${mod_id}.mixins.json"
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IntelliJ no longer downloads javadocs and sources by default, this tells Gradle to force IntelliJ to do it.
idea.module { downloadJavadoc = downloadSources = true }

eclipse {
    // Run everytime eclipse builds the code
    //autoBuildTasks genEclipseRuns
    // Run when importing the project
    synchronizationTasks 'genEclipseRuns'
}

// Merge the resources and classes into the same directory, because Java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Public member signatures help verify the remaining port against the exact target APIs.
tasks.register('writeApiSignatures') {
    doLast {
        def output = layout.buildDirectory.file('diagnostics/api-signatures.txt').get().asFile
        output.parentFile.mkdirs()
        def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get()
        output.withOutputStream { stream ->
            exec {
                executable launcher.metadata.installationPath.file('bin/javap').asFile
                args '-classpath', configurations.compileClasspath.asPath, '-p',
                    'net.minecraft.client.Minecraft',
                    'net.minecraft.client.sounds.MusicManager',
                    'net.minecraft.client.gui.screens.ChatScreen',
                    'net.minecraft.client.sounds.MusicInfo',
                    'net.minecraft.client.player.LocalPlayer',
                    'net.minecraft.client.player.ClientInput',
                    'net.minecraft.client.renderer.LightTexture',
                    'net.minecraft.client.renderer.GameRenderer',
                    'net.minecraft.client.renderer.LevelRenderer',
                    'net.minecraft.client.multiplayer.ClientPacketListener',
                    'net.minecraft.client.multiplayer.MultiPlayerGameMode',
                    'net.minecraft.world.entity.LivingEntity',
                    'net.minecraft.world.entity.player.Player',
                    'net.minecraft.world.entity.Entity',
                    'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase',
                    'net.minecraft.client.renderer.entity.state.EntityRenderState',
                    'net.minecraft.client.gui.GuiGraphics',
                    'net.minecraft.client.Camera',
                    'net.minecraft.client.renderer.state.LevelRenderState',
                    'net.minecraft.network.Connection',
                    'net.minecraft.network.protocol.game.ClientboundExplodePacket',
                    'net.minecraft.network.protocol.game.ClientboundSetEntityMotionPacket',
                    'net.minecraft.network.protocol.game.ServerboundMovePlayerPacket',
                    'net.minecraft.client.DeltaTracker$Timer',
                    'net.minecraft.client.renderer.RenderType',
                    'net.minecraft.client.renderer.RenderType$CompositeState',
                    'net.minecraft.client.renderer.RenderType$CompositeState$CompositeStateBuilder',
                    'net.minecraft.client.renderer.RenderStateShard',
                    'net.minecraft.client.renderer.RenderPipelines',
                    'com.mojang.blaze3d.pipeline.RenderPipeline',
                    'net.minecraft.client.renderer.entity.LivingEntityRenderer',
                    'net.minecraft.client.renderer.block.BlockRenderDispatcher',
                    'net.minecraft.client.renderer.chunk.SectionCompiler',
                    'net.minecraft.world.level.block.Block',
                    'net.minecraft.client.gui.screens.worldselection.CreateWorldScreen',
                    'net.minecraft.client.gui.screens.worldselection.WorldOpenFlows',
                    'net.minecraft.client.gui.screens.worldselection.WorldCreationUiState',
                    'net.minecraft.client.gui.components.Button',
                    'net.minecraftforge.client.FramePassManager$PassDefinition',
                    'net.minecraftforge.client.event.AddFramePassEvent',
                    'net.minecraft.client.renderer.MultiBufferSource$BufferSource',
                    'net.minecraft.client.renderer.RenderStateShard$LineStateShard',
                    'net.minecraft.client.renderer.entity.EntityRenderer',
                    'net.minecraft.client.Screenshot',
                    'com.mojang.blaze3d.systems.RenderSystem',
                    'com.mojang.blaze3d.vertex.VertexConsumer',
                    'net.minecraft.client.input.MouseButtonEvent',
                    'net.minecraft.client.gui.components.events.GuiEventListener',
                    'net.minecraft.client.renderer.texture.DynamicTexture',
                    'com.mojang.blaze3d.platform.NativeImage',
                    'net.minecraft.world.entity.EntityType'
                standardOutput = stream
            }
        }
    }
}

// Compare ported style constants against the original client without requiring a game launch.
tasks.register('visualStyleTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.darkcart.xdolf.LegacyVisualStyleTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check').configure { dependsOn tasks.named('visualStyleTest') }
