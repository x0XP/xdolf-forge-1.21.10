plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.46,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    reobf = false
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'eventbus.api.strictRuntimeChecks', 'true'
            arg "-mixin.config=${mod_id}.mixins.json"
        }

        client {
            if (project.hasProperty('xdolfSmokeTest')) property 'xdolf.smokeTest', 'true'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.12'
}

tasks.named('processResources', ProcessResources) {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar) {
    from('LICENSE')
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': "${mod_id}.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forge expects resources and classes in one output directory for the development run.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

tasks.register('visualStyleTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.x0xp.xdolf.render.VisualStyleTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.register('architectureCheck') {
    group = 'verification'
    description = 'Enforces Xdolf source ownership and one-module-per-file rules.'

    doLast {
        def violations = []
        def xdolfRoot = file('src/main/java/com/x0xp/xdolf')
        def moduleRoot = new File(xdolfRoot, 'module')

        fileTree(xdolfRoot).matching { include '**/*.java' }.files.each { source ->
            if (source.getText('UTF-8').contains('new ClientModule('))
                violations << "Anonymous ClientModule implementation: ${project.relativePath(source)}"
        }

        ['movement', 'network', 'inventory'].each { legacyFolder ->
            if (new File(moduleRoot, legacyFolder).exists())
                violations << "Legacy technical module folder must not exist: module/${legacyFolder}/"
        }

        [player: 'Player', combat: 'Combat', render: 'Render', world: 'World'].each { folder, category ->
            def categoryRoot = new File(moduleRoot, folder)
            if (!categoryRoot.isDirectory()) {
                violations << "Missing module category folder: module/${folder}/"
                return
            }
            fileTree(categoryRoot).matching { include '*Module.java' }.files.each { source ->
                def text = source.getText('UTF-8')
                if (!text.contains('"' + category + '"'))
                    violations << "${project.relativePath(source)} does not declare the ${category} category"
            }
        }

        def allowedRootFiles = ['ClientModule.java', 'ModuleManager.java'] as Set
        fileTree(moduleRoot).matching { include '*.java' }.files.each { source ->
            if (!allowedRootFiles.contains(source.name))
                violations << "Module root contains non-infrastructure source: ${project.relativePath(source)}"
        }

        if (!violations.isEmpty())
            throw new GradleException('Xdolf architecture check failed:\n - ' + violations.join('\n - '))
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('visualStyleTest')
    dependsOn tasks.named('architectureCheck')
}
