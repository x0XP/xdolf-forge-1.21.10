name: Fix keybind UI smoke offset

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-keybind-smoke.yml']

permissions:
  contents: write

jobs:
  fix-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct smoke click for keybind row
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/x0xp/xdolf/ClientScreen.java')
          s = p.read_text()
          old = '        float settingY = killAuraY + 14 + settingRowHeight(rangeRow);\n'
          new = '        float settingY = killAuraY + 14 + KEYBIND_ROW_HEIGHT + settingRowHeight(rangeRow);\n'
          if old not in s:
              raise SystemExit('Smoke offset target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit smoke correction
        run: |
          rm .github/workflows/fix-keybind-smoke.yml
          git config user.name x0XP
          git config user.email 3501503+x0XP@users.noreply.github.com
          git add -A
          git commit -m "Account for keybind row in GUI smoke test"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and package
        run: bash gradlew clean build --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: xdolf-dev14-keybind-config-final
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Test client, GUI controls and world
        run: |
          mkdir -p build/diagnostics
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 300s bash gradlew runClient -PxdolfSmokeTest --console=plain > build/diagnostics/client-smoke.log 2>&1
          smoke_status=$?
          set -e
          tail -n 80 build/diagnostics/client-smoke.log
          test "$smoke_status" -eq 0
          grep -q 'XDOLF_SMOKE_OK' build/diagnostics/client-smoke.log
          grep -q 'inline keybind capture' build/diagnostics/client-smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-keybind-final-smoke-log
          path: build/diagnostics/client-smoke.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-keybind-final-gui-screenshot
          path: run/screenshots/*.png
          if-no-files-found: warn
