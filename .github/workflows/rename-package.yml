name: Rename Xdolf Java package

on:
  push:
    paths:
      - '.github/workflows/rename-package.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename package and source paths
        run: |
          set -euo pipefail

          if [ -d src/main/java/com/darkcart/xdolf ]; then
            mkdir -p src/main/java/com/x0xp
            git mv src/main/java/com/darkcart/xdolf src/main/java/com/x0xp/xdolf
            rmdir src/main/java/com/darkcart 2>/dev/null || true
          fi

          if [ -d src/test/java/com/darkcart/xdolf ]; then
            mkdir -p src/test/java/com/x0xp
            git mv src/test/java/com/darkcart/xdolf src/test/java/com/x0xp/xdolf
            rmdir src/test/java/com/darkcart 2>/dev/null || true
          fi

          while IFS= read -r file; do
            sed -i 's/com\.darkcart\.xdolf/com.x0xp.xdolf/g; s#com/darkcart/xdolf#com/x0xp/xdolf#g' "$file"
          done < <(git grep -Il -e 'com\.darkcart\.xdolf' -e 'com/darkcart/xdolf' || true)

          sed -i 's/^mod_group_id=com\.darkcart\.xdolf$/mod_group_id=com.x0xp.xdolf/' gradle.properties

          git rm .github/workflows/rename-package.yml
          git config user.name 'x0XP'
          git config user.email '3501503+x0XP@users.noreply.github.com'
          git add -A
          git commit -m 'Rename Java package path from darkcart to x0xp'
          git push origin HEAD:main
