name: Apply tracer target fixes

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-tracer-targets.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch tracer rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/x0xp/xdolf/render/WorldVisuals.java')
          text = path.read_text()

          replacements = [
              (
                  '            for(var box:scene.boxes)drawBox(buffers,pose.last().pose(),box,scene.camera);',
                  '            for(var box:scene.boxes)drawBox(buffers,pose.last().pose(),box,scene.camera);'
              ),
              (
                  '            modelView.popMatrix();\n        }',
                  '            modelView.popMatrix();\n            // Never allow the late renderer to reuse primitives from a previous extraction.\n            scene=Scene.empty();\n        }'
              ),
              (
                  '        for(var entity:mc.level.entitiesForRendering()) {\n            if(entity instanceof Player player&&player!=mc.player) {',
                  '        for(var entity:mc.level.entitiesForRendering()) {\n            if(entity.isRemoved())continue;\n            if(entity instanceof Player player&&player!=mc.player) {'
              ),
              (
                  '                    segments.add(new Segment(start,entity.position(),VisualStyle.tracerColor(mc.player.distanceTo(entity),SocialState.isFriend(entity.getName().getString())),VisualStyle.TRACER_WIDTH,true));',
                  '                    segments.add(new Segment(start,player.getPosition(partial).add(0.0,player.getBbHeight()*0.5,0.0),VisualStyle.tracerColor(mc.player.distanceTo(entity),SocialState.isFriend(entity.getName().getString())),VisualStyle.TRACER_WIDTH,true));'
              ),
              (
                  '            int radius=mc.options.renderDistance().get()+2;',
                  '            // Scan only the effective visible distance, not Minecraft\'s extra client chunk buffer.\n            int radius=mc.options.getEffectiveRenderDistance();'
              ),
              (
                  '                for(var be:loaded.getBlockEntities().values()) {\n                    var pos=be.getBlockPos();',
                  '                for(var be:loaded.getBlockEntities().values()) {\n                    if(be.isRemoved())continue;\n                    var pos=be.getBlockPos();'
              ),
              (
                  '                        segments.add(new Segment(start,Vec3.atLowerCornerOf(pos),VisualStyle.CHEST_TRACER,VisualStyle.TRACER_WIDTH,true));',
                  '                        segments.add(new Segment(start,Vec3.atCenterOf(pos),VisualStyle.CHEST_TRACER,VisualStyle.TRACER_WIDTH,true));'
              ),
          ]

          for old, new in replacements:
              if old == new:
                  continue
              if old not in text:
                  raise SystemExit(f'expected source not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "x0XP"
          git config user.email "3501503+x0XP@users.noreply.github.com"
          git rm .github/workflows/fix-tracer-targets.yml
          git add src/main/java/com/x0xp/xdolf/render/WorldVisuals.java
          git commit -m "Fix tracer target alignment and stale objects"
          git push origin HEAD:main
