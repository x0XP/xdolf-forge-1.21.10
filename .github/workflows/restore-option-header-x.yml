name: Restore option header horizontal layout

on:
  push:
    paths:
      - '.github/workflows/restore-option-header-x.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore previous header X layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/java/com/x0xp/xdolf/ConfigContainer.java')
          text = path.read_text()
          pattern = re.compile(
              r'\s*float headerMid = left \+ \(right - left\) / 2f;.*?'
              r'headerTextY, fade\(0xFF8C929D, progress\)\);',
              re.S,
          )
          replacement = '''
        rect(graphics, left + 1, top + HEADER_HEIGHT - 1, left + 47, top + HEADER_HEIGHT, fade(0xFFFF2020, progress));
        rect(graphics, left + 47, top + HEADER_HEIGHT - 1, right, top + HEADER_HEIGHT, fade(0xFF329CFF, progress));
        float headerTextY = centered(cardTop, top + HEADER_HEIGHT - 1);
        XdolfFont.drawCompact(graphics, XdolfFont.compactTrim(ClientScreen.label(module), 48),
            left + 4, headerTextY, fade(0xFFFFFFFF, progress));
        String options = "OPTIONS";
        XdolfFont.drawCompact(graphics, options, right - 4 - XdolfFont.compactWidth(options), headerTextY,
            fade(0xFF8C929D, progress));'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'header block regex match count was {count}')
          path.write_text(text)
          PY

          rm .github/workflows/restore-option-header-x.yml
          git config user.name 'x0XP'
          git config user.email '3501503+x0XP@users.noreply.github.com'
          git add src/main/java/com/x0xp/xdolf/ConfigContainer.java .github/workflows/restore-option-header-x.yml
          git commit -m 'Restore original option header horizontal layout'
          git push
