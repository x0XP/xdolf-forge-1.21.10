name: Restore option header horizontal layout

on:
  push:
    paths:
      - '.github/workflows/restore-option-header-x.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore previous header X layout
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/main/java/com/x0xp/xdolf/ConfigContainer.java'); t=p.read_text(); a=t.index('        float headerMid = left + (right - left) / 2f;'); marker='            headerTextY, fade(0xFF8C929D, progress));'; b=t.index(marker,a)+len(marker); r='        rect(graphics, left + 1, top + HEADER_HEIGHT - 1, left + 47, top + HEADER_HEIGHT, fade(0xFFFF2020, progress));\n        rect(graphics, left + 47, top + HEADER_HEIGHT - 1, right, top + HEADER_HEIGHT, fade(0xFF329CFF, progress));\n        float headerTextY = centered(cardTop, top + HEADER_HEIGHT - 1);\n        XdolfFont.drawCompact(graphics, XdolfFont.compactTrim(ClientScreen.label(module), 48),\n            left + 4, headerTextY, fade(0xFFFFFFFF, progress));\n        String options = \\\"OPTIONS\\\";\n        XdolfFont.drawCompact(graphics, options, right - 4 - XdolfFont.compactWidth(options), headerTextY,\n            fade(0xFF8C929D, progress));'; p.write_text(t[:a]+r+t[b:])"
          rm .github/workflows/restore-option-header-x.yml
          git config user.name 'x0XP'
          git config user.email '3501503+x0XP@users.noreply.github.com'
          git add src/main/java/com/x0xp/xdolf/ConfigContainer.java .github/workflows/restore-option-header-x.yml
          git commit -m 'Restore original option header horizontal layout'
          git push
