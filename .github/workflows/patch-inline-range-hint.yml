name: Patch inline numeric settings layout

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-inline-range-hint.yml']

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove cluttered min-max hint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/main/java/com/x0xp/xdolf/ClientScreen.java')
          text = path.read_text()
          pattern = r'\n\s*if \(stacked\) \{\n\s*String limits = row\.integer.*?\n\s*\}\n\n(\s*float trackLeft = left;)'
          updated, count = re.subn(pattern, r'\n\1', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one stacked range-hint block, removed {count}')
          path.write_text(updated)
          PY

      - name: Commit cleanup and remove one-off workflow
        run: |
          git config user.name "x0XP"
          git config user.email "3501503+x0XP@users.noreply.github.com"
          git rm -f .github/workflows/patch-inline-range-hint.yml
          git add src/main/java/com/x0xp/xdolf/ClientScreen.java
          git commit -m "Clean up stacked numeric setting layout"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and package
        run: bash gradlew clean build --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: xdolf-forge-dev14-clean-settings
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Test client, GUI controls and world
        run: |
          mkdir -p build/diagnostics
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 300s bash gradlew runClient -PxdolfSmokeTest --console=plain > build/diagnostics/client-smoke.log 2>&1
          smoke_status=$?
          set -e
          tail -n 60 build/diagnostics/client-smoke.log
          test "$smoke_status" -eq 0
          grep -q 'XDOLF_SMOKE_OK' build/diagnostics/client-smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-clean-settings-smoke-log
          path: build/diagnostics/client-smoke.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-clean-settings-screenshots
          path: run/screenshots/*.png
          if-no-files-found: warn
