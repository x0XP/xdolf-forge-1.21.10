name: Apply textbox centering fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-textbox-centering.yml'

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply textbox centering patch
        run: python .github/patch-textbox-centering.py

      - name: Commit final source and remove temporary patch files
        run: |
          rm .github/patch-textbox-centering.py .github/workflows/apply-textbox-centering.yml
          git config user.name 'x0XP'
          git config user.email '3501503+x0XP@users.noreply.github.com'
          git add -A
          git commit -m 'Center textbox values vertically'
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and package
        run: bash gradlew clean build --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: xdolf-textbox-centering
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Test client, GUI controls and world
        run: |
          mkdir -p build/diagnostics
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 300s bash gradlew runClient -PxdolfSmokeTest --console=plain > build/diagnostics/client-smoke.log 2>&1
          smoke_status=$?
          set -e
          tail -n 80 build/diagnostics/client-smoke.log
          test "$smoke_status" -eq 0
          grep -q 'XDOLF_SMOKE_OK' build/diagnostics/client-smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-textbox-centering-smoke-log
          path: build/diagnostics/client-smoke.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-textbox-centering-gui-screenshot
          path: run/screenshots/*.png
          if-no-files-found: warn
