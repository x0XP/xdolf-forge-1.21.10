name: UI Boundary Fix

on:
  push:
    branches: [package-organisation]
    paths:
      - '.github/workflows/ui-boundary-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: package-organisation
      - name: Make UI boundary contracts explicit
        shell: python
        run: |
          from pathlib import Path

          root = Path('src/main/java/com/x0xp/xdolf')

          screen = root / 'ui/clickgui/ClientScreen.java'
          text = screen.read_text()
          if 'import com.x0xp.xdolf.ui.UiDraw;' not in text:
              text = text.replace('package com.x0xp.xdolf.ui.clickgui;\n', 'package com.x0xp.xdolf.ui.clickgui;\n\nimport com.x0xp.xdolf.ui.UiDraw;\n', 1)
          text = text.replace('    ClientScreen() {', '    public ClientScreen() {')
          screen.write_text(text)

          config = root / 'ui/clickgui/ConfigContainer.java'
          text = config.read_text()
          if 'import com.x0xp.xdolf.ui.UiDraw;' not in text:
              text = text.replace('package com.x0xp.xdolf.ui.clickgui;\n', 'package com.x0xp.xdolf.ui.clickgui;\n\nimport com.x0xp.xdolf.ui.UiDraw;\n', 1)
          config.write_text(text)

          font = root / 'ui/XdolfFont.java'
          text = font.read_text().replace('    static void smokeRasterScale(', '    public static void smokeRasterScale(')
          font.write_text(text)
      - name: Commit UI boundary fixes
        run: |
          git config user.name x0XP
          git config user.email 3501503+x0XP@users.noreply.github.com
          git add src
          git commit -m "Make UI package boundaries explicit"
          git push origin package-organisation
