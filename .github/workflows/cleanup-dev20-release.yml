name: Cleanup superseded Xdolf release

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-dev20-release.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove dev.20 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="xdolf-4.0.0-dev.20"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "Removed $TAG"
          else
            echo "$TAG already absent"
          fi
