name: Fix UI motion patch

on:
  push:
    paths:
      - '.github/workflows/fix-ui-motion-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct generated source
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/main/java/com/x0xp/xdolf/Hud.java'); s=p.read_text().replace('new IdentityHashMap();','new IdentityHashMap<>();').replace('!m.name.equals(\"Fulbright\")','!m.name.equals(\"Fullbright\")').replace('if(entry==null\n                entry=','if(entry==null) {\n                entry='); p.write_text(s); p=Path('src/main/java/com/x0xp/xdolf/ClientScreen.java'); s=p.read_text().replace('0xCCC7B828F','0xCC7B828F'); p.write_text(s)"
          rm .github/workflows/fix-ui-motion-patch.yml
          git config user.name 'x0XP'
          git config user.email '3501503+x0XP@users.noreply.github.com'
          git add src/main/java/com/x0xp/xdolf/Hud.java src/main/java/com/x0xp/xdolf/ClientScreen.java .github/workflows/fix-ui-motion-patch.yml
          git commit -m 'Correct UI motion source patch'
          git push
