name: Remove superseded Xdolf dev.21 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-dev21.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove dev.21 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete xdolf-4.0.0-dev.21 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag

      - name: Remove temporary cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "x0XP"
          git config user.email "3501503+x0XP@users.noreply.github.com"
          git rm .github/workflows/remove-dev21.yml
          git commit -m "Remove temporary dev.21 cleanup workflow"
          git push origin HEAD:main
