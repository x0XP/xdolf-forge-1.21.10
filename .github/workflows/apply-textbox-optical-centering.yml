name: Apply textbox optical centering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-textbox-optical-centering.yml'

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply optical textbox centering correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/x0xp/xdolf/ClientScreen.java')
          text = p.read_text()
          first = '        int valueY = Math.round(fieldTop) + XdolfFont.centeredYOffset('
          second = '            Math.round(fieldTop), Math.round(fieldBottom - fieldTop), Math.round(fieldTop));'
          if text.count(first) != 2 or text.count(second) < 2:
              raise SystemExit(f'Unexpected textbox valueY layout: first={text.count(first)}, second={text.count(second)}')
          text = text.replace(first, '        float valueY = Math.round(fieldTop) + XdolfFont.centeredYOffset(', 2)
          text = text.replace(second, '            Math.round(fieldTop), Math.round(fieldBottom - fieldTop), Math.round(fieldTop)) + 1.5f;', 2)
          p.write_text(text)
          PY

      - name: Commit final source and remove temporary workflow
        run: |
          rm .github/workflows/apply-textbox-optical-centering.yml
          git config user.name 'x0XP'
          git config user.email '3501503+x0XP@users.noreply.github.com'
          git add src/main/java/com/x0xp/xdolf/ClientScreen.java .github/workflows/apply-textbox-optical-centering.yml
          git commit -m 'Correct textbox optical text alignment'
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and package
        run: bash gradlew clean build --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: xdolf-textbox-optical-centering
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Test client, GUI controls and world
        run: |
          mkdir -p build/diagnostics
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 300s bash gradlew runClient -PxdolfSmokeTest --console=plain > build/diagnostics/client-smoke.log 2>&1
          smoke_status=$?
          set -e
          tail -n 60 build/diagnostics/client-smoke.log
          test "$smoke_status" -eq 0
          grep -q 'XDOLF_SMOKE_OK' build/diagnostics/client-smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-textbox-optical-centering-smoke-log
          path: build/diagnostics/client-smoke.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-textbox-optical-centering-gui-screenshot
          path: run/screenshots/*.png
          if-no-files-found: warn
