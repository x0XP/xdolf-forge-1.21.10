name: Final Package Alignment Migration

on:
  push:
    branches: [package-organisation]
    paths:
      - '.github/workflows/final-package-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: package-organisation
      - name: Align every Java package with its source path
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          package_base = 'com.x0xp.xdolf'
          main_root = Path('src/main/java/com/x0xp/xdolf')
          test_root = Path('src/test/java/com/x0xp/xdolf')
          roots = [root for root in (main_root, test_root) if root.exists()]
          files = [p for root in roots for p in root.rglob('*.java')]

          package_re = re.compile(r'^package\s+([\w.]+);', re.M)
          declaration_re = re.compile(
              r'(?m)^\s*(?:public\s+|protected\s+|private\s+)?(?:abstract\s+|final\s+|sealed\s+|non-sealed\s+)?'
              r'(?:class|interface|record|enum)\s+([A-Za-z_$][\w$]*)'
          )

          metadata = {}
          by_name = {}
          for path in files:
              root = main_root if path.is_relative_to(main_root) else test_root
              relative_parent = path.parent.relative_to(root)
              desired = package_base
              if relative_parent.parts:
                  desired += '.' + '.'.join(relative_parent.parts)
              text = path.read_text()
              match = package_re.search(text)
              if not match:
                  raise RuntimeError(f'Missing package declaration: {path}')
              old = match.group(1)
              declarations = declaration_re.findall(text)
              metadata[path] = (old, desired, declarations)
              for name in declarations:
                  by_name.setdefault(name, []).append((path, old, desired))

          # Prefer main-source ownership for a simple name; skip genuinely ambiguous names.
          symbols = {}
          for name, entries in by_name.items():
              main_entries = [entry for entry in entries if entry[0].is_relative_to(main_root)]
              choices = main_entries or entries
              desired_packages = {(entry[2], entry[0]) for entry in choices}
              if len(desired_packages) == 1:
                  path, old, desired = choices[0]
                  symbols[name] = (path, old, desired)

          # First update declarations and any fully-qualified references/imports.
          fqcn_moves = {}
          for name, (_, old, desired) in symbols.items():
              if old != desired:
                  fqcn_moves[f'{old}.{name}'] = f'{desired}.{name}'

          for path in files:
              old, desired, _ = metadata[path]
              text = path.read_text()
              text = package_re.sub(f'package {desired};', text, count=1)
              for old_fqcn, new_fqcn in sorted(fqcn_moves.items(), key=lambda item: -len(item[0])):
                  text = text.replace(old_fqcn, new_fqcn)
              # The historical catch-all root import is replaced by explicit ownership imports below.
              text = text.replace('import com.x0xp.xdolf.*;\n', '')
              path.write_text(text)

          def code_without_comments_or_literals(text):
              pattern = re.compile(
                  r'//[^\n]*|/\*.*?\*/|"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'',
                  re.S
              )
              return pattern.sub(' ', text)

          # Then add exact imports for project types that are no longer in the same package.
          for path in files:
              _, desired, own_declarations = metadata[path]
              text = path.read_text()
              searchable = code_without_comments_or_literals(text)
              imports = []
              for name, (owner_path, _, owner_package) in symbols.items():
                  if owner_path == path or name in own_declarations or owner_package == desired:
                      continue
                  if not re.search(r'\b' + re.escape(name) + r'\b', searchable):
                      continue
                  fqcn = f'{owner_package}.{name}'
                  if f'import {fqcn};' not in text and f'import static {fqcn}.' not in text:
                      imports.append(f'import {fqcn};')
              if imports:
                  package_end = text.find('\n') + 1
                  text = text[:package_end] + '\n' + '\n'.join(sorted(set(imports))) + '\n' + text[package_end:]
                  path.write_text(text)

          # Mixin entries are derived from the mixin source folders so config cannot drift from layout.
          mixin_root = main_root / 'mixin'
          mixin_config = Path('src/main/resources/xdolf.mixins.json')
          data = json.loads(mixin_config.read_text())
          data['package'] = package_base + '.mixin'
          class_paths = {}
          for path in mixin_root.rglob('*.java'):
              relative = path.relative_to(mixin_root).with_suffix('')
              class_paths[path.stem] = '.'.join(relative.parts)
          data['client'] = [class_paths.get(entry.rsplit('.', 1)[-1], entry) for entry in data.get('client', [])]
          mixin_config.write_text(json.dumps(data, indent=2) + '\n')

          # The visual regression test moved into the render package with its path.
          gradle = Path('build.gradle')
          gradle_text = gradle.read_text().replace(
              "mainClass = 'com.x0xp.xdolf.VisualStyleTest'",
              "mainClass = 'com.x0xp.xdolf.render.VisualStyleTest'"
          )
          gradle.write_text(gradle_text)
      - name: Commit package alignment
        run: |
          git config user.name x0XP
          git config user.email 3501503+x0XP@users.noreply.github.com
          git add src build.gradle
          git commit -m "Align all Java packages with source paths"
          git push origin package-organisation
