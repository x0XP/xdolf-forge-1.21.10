name: Cleanup broken Xdolf releases

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-broken-releases.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove broken releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in xdolf-4.0.0-dev.18 xdolf-4.0.0-dev.19; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "Removed $tag"
            else
              echo "$tag already absent"
            fi
          done
