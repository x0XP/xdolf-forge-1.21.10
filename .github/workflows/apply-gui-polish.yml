name: Apply GUI scrolling and polish

on:
  push:
    paths:
      - '.github/patch-gui-polish.py'
      - '.github/workflows/apply-gui-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply polish patch
        run: python3 .github/patch-gui-polish.py
      - name: Commit polished source and remove temporary patch files
        run: |
          rm .github/patch-gui-polish.py .github/workflows/apply-gui-polish.yml
          git config user.name x0XP
          git config user.email 3501503+x0XP@users.noreply.github.com
          git add -A
          git commit -m "Polish scrolling, keybind conflicts and notifications"
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package
        run: bash gradlew clean build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: xdolf-dev14-gui-polish
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Test client, GUI controls and world
        run: |
          mkdir -p build/diagnostics
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 300s bash gradlew runClient -PxdolfSmokeTest --console=plain > build/diagnostics/client-smoke.log 2>&1
          smoke_status=$?
          set -e
          tail -n 100 build/diagnostics/client-smoke.log
          test "$smoke_status" -eq 0
          grep -q 'XDOLF_SMOKE_OK' build/diagnostics/client-smoke.log
          grep -q 'smooth category scrolling, keybind conflicts' build/diagnostics/client-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-gui-polish-smoke-log
          path: build/diagnostics/client-smoke.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdolf-gui-polish-screenshots
          path: run/screenshots/*.png
          if-no-files-found: warn
