name: Publish xdolf-4.0.0-dev.16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dev16.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c9a489c71cf895b627bc438a1fb51b781eb39240
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build release jar
        run: bash gradlew clean build --console=plain

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f build/libs/xdolf-4.0.0-dev.16.jar
          gh release create xdolf-4.0.0-dev.16 \
            build/libs/xdolf-4.0.0-dev.16.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target c9a489c71cf895b627bc438a1fb51b781eb39240 \
            --title "xdolf-4.0.0-dev.16" \
            --notes "Xdolf 4 Developer Build" \
            --prerelease
