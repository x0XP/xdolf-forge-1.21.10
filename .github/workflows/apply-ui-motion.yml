name: Apply click GUI and HUD motion update

on:
  push:
    paths:
      - '.github/workflows/apply-ui-motion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply UI motion changes
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
          rm .github/workflows/apply-ui-motion.yml
          git config user.name 'x0XP'
          git config user.email '3501503+x0XP@users.noreply.github.com'
          git add src/main/java/com/x0xp/xdolf/UiDraw.java src/main/java/com/x0xp/xdolf/XdolfFont.java src/main/java/com/x0xp/xdolf/ClientScreen.java src/main/java/com/x0xp/xdolf/Hud.java .github/workflows/apply-ui-motion.yml
          git commit -m 'Animate click GUI and enabled module list'
          git push
