name: Align option field hitboxes

on:
  push:
    paths:
      - '.github/workflows/fix-option-hitbox.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align rendered keybind and click target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/x0xp/xdolf/ClientScreen.java')
          text = path.read_text()
          old = 'float keyFieldLeft = right - 3 - ConfigContainer.FIELD_WIDTH;'
          new = 'float keyFieldLeft = rowRight - ConfigContainer.FIELD_WIDTH;'
          if old not in text:
              raise SystemExit('Expected keybind hitbox expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-option-hitbox.yml
          git config user.name 'x0XP'
          git config user.email '3501503+x0XP@users.noreply.github.com'
          git add src/main/java/com/x0xp/xdolf/ClientScreen.java .github/workflows/fix-option-hitbox.yml
          git commit -m 'Align option input hitboxes'
          git push
